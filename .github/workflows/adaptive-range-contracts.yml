name: Adaptive range contracts

on:
  pull_request:
    paths:
      - 'game/**'
      - 'production/GAME-PRODUCTION-CONTROL-PLANE.md'
      - 'learning/missions/TRAINING-RANGE-*.yaml'
      - 'schemas/prm3-*.json'
      - '.github/workflows/adaptive-range-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'production/GAME-PRODUCTION-CONTROL-PLANE.md'
      - 'learning/missions/TRAINING-RANGE-*.yaml'
      - 'schemas/prm3-*.json'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse JSON contracts
        run: |
          python -m json.tool schemas/prm3-tactical-learning-mission.schema.json >/dev/null
          python -m json.tool schemas/prm3-mission-readiness.schema.json >/dev/null

      - name: Parse tactical and Training Range YAML
        run: |
          ruby -e "require 'yaml'; %w[
            game/TACTICAL-CORE-MECHANICS.yaml
            learning/missions/TRAINING-RANGE-01-RISK-AND-CONTROLS.yaml
            learning/missions/TRAINING-RANGE-02-NETWORK-PATH.yaml
            learning/missions/TRAINING-RANGE-03-TRUST-AND-IDENTITY.yaml
          ].each { |p| YAML.load_file(p, aliases: true); puts \"parsed #{p}\" }"

      - name: Enforce tactical game identity
        run: |
          ruby <<'RUBY'
          require 'yaml'
          data = YAML.load_file('game/TACTICAL-CORE-MECHANICS.yaml', aliases: true)

          raise 'final player presentation must be game' unless data.dig('product_identity', 'final_player_presentation_must_be_game') == true
          raise 'form only range cannot be final' unless data.dig('product_identity', 'form_only_training_range_allowed_as_final') == false
          raise 'combat and technical work must share mission state' unless data.dig('product_identity', 'combat_and_technical_work_share_one_mission_state') == true
          raise 'kills cannot award technical mastery' unless data.dig('product_identity', 'technical_mastery_may_be_awarded_by_kills') == false
          raise 'standard AP contract changed' unless data.dig('turn_model', 'standard_action_points') == 2
          raise 'cover must include low and high' unless data.dig('combat_model', 'cover', 'states') == ['NONE', 'LOW', 'HIGH']
          raise 'flanking required' unless data.dig('combat_model', 'cover', 'flanking') == true
          raise 'concealment required' unless data.dig('combat_model', 'concealment', 'enabled') == true
          raise 'technical truth must be deterministic' unless data.dig('combat_model', 'deterministic_technical_truth') == true
          raise 'threat AI cannot read learner model' unless data.dig('information_model', 'hostile_awareness', 'may_read_hidden_learner_model') == false
          raise 'variant compiler cannot mutate truth after launch' unless data.dig('adaptive_system', 'mission_variant_compiler', 'may_mutate_truth_after_launch') == false
          raise 'director cannot mutate technical answer' unless data.dig('adaptive_system', 'mission_director', 'may_change_correct_technical_answer') == false
          raise 'evaluator must be separate from variant compiler' unless data.dig('adaptive_system', 'learning_evaluator', 'separate_from_variant_compiler') == true
          raise 'evaluator must be separate from threat AI' unless data.dig('adaptive_system', 'learning_evaluator', 'separate_from_threat_ai') == true
          raise 'Training Range must be full 3D tactical simulation' unless data.dig('training_ranges', 'final_format') == 'FULL_3D_TACTICAL_SIMULATION'
          raise 'Training Range requires playable characters' unless data.dig('training_ranges', 'require_playable_characters') == true
          raise 'Training Range requires cover and positioning' unless data.dig('training_ranges', 'require_cover_and_positioning') == true
          raise 'Training Range requires lab node' unless data.dig('training_ranges', 'require_lab_node') == true
          raise 'systems harness must not be final game' unless data.dig('prototype_policy', 'systems_harness_is_final_game') == false
          RUBY

      - name: Enforce Training Range fairness and identity
        run: |
          ruby <<'RUBY'
          require 'yaml'

          expected = {
            'TRAINING-RANGE-01-RISK-AND-CONTROLS.yaml' => ['TR01-RISK-AND-CONTROLS', ['M01']],
            'TRAINING-RANGE-02-NETWORK-PATH.yaml' => ['TR02-NETWORK-PATH', ['M02']],
            'TRAINING-RANGE-03-TRUST-AND-IDENTITY.yaml' => ['TR03-TRUST-AND-IDENTITY', ['M03']]
          }

          expected.each do |file, (mission_id, modules)|
            path = File.join('learning', 'missions', file)
            data = YAML.load_file(path, aliases: true)

            raise "#{file}: mission_kind" unless data['mission_kind'] == 'TRAINING_RANGE'
            raise "#{file}: mission_id" unless data['mission_id'] == mission_id
            raise "#{file}: principles modules" unless data['principles_module_ids'] == modules
            raise "#{file}: story writeback" unless data.dig('training_context', 'canon_writeback') == false
            raise "#{file}: story consequences" unless data.dig('training_context', 'story_consequences_disabled') == true
            raise "#{file}: required tools can never be removed" unless data.dig('preparation_contract', 'weakness_may_remove_required_tools') == false
            raise "#{file}: variant compiler cannot mutate truth" unless data.dig('adaptation', 'variant_compiler', 'may_change_hidden_technical_truth_during_mission') == false
            raise "#{file}: director cannot mutate answer" unless data.dig('adaptation', 'mission_director', 'technical_answer_mutation_allowed') == false
            raise "#{file}: evaluator separation" unless data.dig('adaptation', 'learning_evaluator_separate_from_variant_compiler') == true
            raise "#{file}: mastery intervention law" unless data.dig('learning_mastery', 'intervention_cannot_auto_award_mastery') == true
            raise "#{file}: evidence traces missing" unless Array(data['evidence_trace_contract']).any?
            raise "#{file}: verifier contract missing" unless Array(data['verifier_contract']).any?
          end
          RUBY

      - name: Enforce current foundation mapping and game presentation in canon
        run: |
          grep -q 'M01  Security Foundations and Risk' game/TRAINING-RANGE-AUTHORITY.md
          grep -q 'M02  Networking Foundations' game/TRAINING-RANGE-AUTHORITY.md
          grep -q 'M03  Identity, Cryptography and Access' game/TRAINING-RANGE-AUTHORITY.md
          grep -q 'Training Range means a real playable tactical simulation' game/TRAINING-RANGE-AUTHORITY.md
          grep -q 'Training Range Systems Harness' game/TRAINING-RANGE-AUTHORITY.md
          grep -q 'PRIM3 Missions are a real turn based 3D tactical game' game/XCOM2-MECHANIC-ADAPTATION-AUTHORITY.md
          grep -q 'TR01-RISK-AND-CONTROLS' game/LEARNING-MISSION-SOURCE-OF-TRUTH.md
          grep -q 'TR02-NETWORK-PATH' game/LEARNING-MISSION-SOURCE-OF-TRUTH.md
          grep -q 'TR03-TRUST-AND-IDENTITY' game/LEARNING-MISSION-SOURCE-OF-TRUTH.md
