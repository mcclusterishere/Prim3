          concept_id: governance.authorization
          predicate: need-to-know boundary set without locking authorized incident staff out
          score_delta: 8
        - event: concept.applied
          concept_id: forensics.evidence-preservation
          predicate: evidence zone SECURE during T preserve/seal step
          score_delta: 8

    - id: LAB-T-CONTAINMENT
      world_object: Personnel Service Dependency Console
      zone: Z-IDP
      owner_role: T
      concept_ids:
        - incident.containment
        - forensics.evidence-preservation
        - identity.mfa
        - network.segmentation
        - incident.unauthorized-access
      prerequisites: [LAB-R-TIMELINE at least CHARACTERIZED]
      initial_state: UNKNOWN
      terminal_states: [VERIFIED, STABILIZED, DEGRADED, CONTAMINATED]
      task_graph:
        - step_id: T-CT-01-OBSERVE
          atom: OBSERVE
          role: T
          ap_cost: 0
          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: none
          requires_tokens: []
          consumes_tokens: []
          produces_tokens: []
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: OBSERVED
          success_deltas:
