          recovery_step_ids: [E-CU-03-HOLD]
        - step_id: E-CU-04-ESCORT
          atom: ESCORT
          role: E
          ap_cost: 1
          window_cost: 0
          requires_control: SECURE
          requires_picture: none
          requires_tokens: [EV-PHYSICAL-CUSTODY]
          consumes_tokens: []
          produces_tokens: []
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: VALIDATION_PENDING
          success_deltas:
            - non_incident_staff moved outside evidence boundary
            - privacy_exposure risk -1
          misapplication_to: DEGRADED
          misapplication_deltas:
            - operations_congestion +1
          interrupt_to: WORK_IN_PROGRESS
          interrupt_deltas: []
          recovery_step_ids: [E-CU-04-ESCORT]
        - step_id: E-CU-05-STABILIZE
          atom: STABILIZE
          role: E
          ap_cost: 1
          window_cost: 0
          requires_control: SECURE
          requires_picture: none
          requires_tokens: [EV-PHYSICAL-CUSTODY]
          consumes_tokens: []
          produces_tokens: []
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: STABILIZED
          success_deltas:
            - dossier_custody physical_boundary_stable
            - first retriever theft interaction blocked unless E leaves zone
          misapplication_to: DEGRADED
          misapplication_deltas:
