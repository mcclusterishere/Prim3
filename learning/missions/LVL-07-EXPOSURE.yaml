  threats:
    - threat_id: TH-RETRIEVER-1
      archetype: retriever
      start_zone: Z-LOADING
      hp: 4
      aim: 58
      movement: 5
      priorities:
        - reach Z-EVIDENCE
        - interact with evidence_locker
        - exit through Z-LOADING if carrying evidence
        - engage E if blocked
      lab_interactions:
        - if evidence room not SECURE, 1 AP interaction reduces dossier_custody one state
        - if carrying evidence, T loses optional dossier objective unless retriever is stopped before exit
      detection_interactions:
        - spotted entering public corridor adds Detection +1
    - threat_id: TH-INTERDICTOR-1
      archetype: interdictor
      start_zone: Z-LOADING
      hp: 4
      aim: 62
      movement: 5
      priorities:
        - pressure Z-IDP
        - force T interruption
        - attack E if E holds doorway
      lab_interactions:
        - successful hit on anchored T triggers hard interrupt
      detection_interactions:
        - gunfight in Z-IDP adds extra Detection due sensitive infrastructure
    - threat_id: TH-SPOTTER-1
      archetype: spotter
      start_zone: Z-MAINT
      hp: 3
      aim: 50
      movement: 6
      priorities:
        - acquire LOS on Z-IDP or Z-EVIDENCE
        - increase hostile picture
        - avoid direct firefight
      lab_interactions:
        - while LOS maintained, first T fragile action each round gains interruption risk
      detection_interactions:
        - active spotter raises Detection +1 at Clock phase
    - threat_id: TH-RESPONDER-1
      archetype: responder
      start_zone: Z-EXIT
      hp: 5
      aim: 60
      movement: 5
      priorities:
        - investigate gunfire
        - challenge unidentified actors
        - become allied-neutral if authorization state clearly demonstrated
      lab_interactions:
        - can create privacy exposure if routed through evidence room without E authorization control
      detection_interactions:
        - unnecessary engagement with responder adds Detection +2 and major Compliance penalty

  kinetic_technical_links:
    - link_id: KT-01
      trigger: gunfire in Z-EVIDENCE
      condition: line crosses evidence_locker or evidence_terminal
      effect: evidence_integrity -1 if destructible prop is hit; otherwise Detection +1
      affects: evidence
    - link_id: KT-02
      trigger: E uses Suppress on Interdictor
      condition: Interdictor within one move of Z-IDP
      effect: Interdictor cannot reach T this Threat phase; buys one technical activation
      affects: lab
    - link_id: KT-03
      trigger: R uses Overwatch from Z-OPS sightline
      condition: Retriever crosses Z-CORRIDOR
      effect: reaction shot can stop theft route but shot near glass may raise Detection
      affects: route
    - link_id: KT-04
      trigger: T is hit while anchored on Preserve or Recover
      condition: Guard Tech not active
      effect: hard interrupt; node enters RECOVERABLE and requires VERIFY before continuation
      affects: lab
    - link_id: KT-05
      trigger: E abandons Z-EVIDENCE
      condition: Retriever active and EV-PHYSICAL-CUSTODY expired
      effect: evidence room ControlState becomes CONTESTED; theft interaction becomes possible
      affects: control
    - link_id: KT-06
      trigger: destructive fire damages UPS panel
      condition: Z-MAINT line of fire intersects panel
      effect: power_state -> BACKUP/UNSTABLE; T recovery steps gain mandatory revalidation
      affects: service

  technical_kinetic_links:
    - link_id: TK-01
      trigger: containment_state becomes VERIFIED
      condition: none
      effect: hostile remote dossier-control route is disabled; Retriever cannot remotely bypass evidence door
      affects: enemy_ai
    - link_id: TK-02
      trigger: timeline_state becomes SEALED
      condition: incident_scope_confidence >= 70
      effect: R reveals correct enemy entry likelihood and one responder ETA
      affects: reinforcement
    - link_id: TK-03
      trigger: trusted_service_health >= 60 and training_frontend trusted_return == true
      condition: none
      effect: internal authenticated comms restore; squad receives one free shared status ping each round
      affects: route
    - link_id: TK-04
      trigger: identity_provider correctly interpreted
      condition: false_identity_confidence == false
      effect: responder authorization challenge can be resolved without combat if E presents verified incident role state
      affects: enemy_ai
    - link_id: TK-05
      trigger: broad shutdown misapplication
      condition: trusted_service_health < 35
      effect: access doors fail to manual mode in one corridor, changing route and cover geometry
      affects: door

  interruption_rules:
    - rule_id: INT-01
      class: soft
      trigger: alarm or nearby non-damaging movement during T non-fragile step
      mitigated_by: [Z-IDP SECURE]
      effect: no progress loss when secure; otherwise next Verify costs 1 additional AP-equivalent stage
      recovery: re-verify affected state
    - rule_id: INT-02
      class: hard
      trigger: anchored T takes damage
      mitigated_by: [Guard Tech]
      effect: current fragile stage stops and node enters RECOVERABLE
      recovery: explicit Verify/Revalidate step
    - rule_id: INT-03
      class: hard
      trigger: evidence room becomes LOST during Preserve
      mitigated_by: [EV-PHYSICAL-CUSTODY, Hold Equipment]
      effect: evidence_integrity -1 unless E re-secures before next Clock phase
      recovery: re-secure + verify custody
    - rule_id: INT-04
      class: catastrophic
      trigger: evidence_locker destroyed
      mitigated_by: [E Control, careful fire discipline]
      effect: optional dossier preservation objective becomes unavailable; primary containment remains playable
      recovery: preserve remaining telemetry and extract partial proof

  scripted_pressure_curve:
    - round: 1
      event: incident begins under uncertainty; no hostile contact visible
      design_goal: teach R evidence comparison and E boundary positioning before gunfire
    - round: 2
      event: vendor/loading anomaly appears; Retriever enters hidden movement state
      design_goal: make R decide between deeper analysis and overwatch positioning
    - round: 3
      event: first physical hostile contact becomes likely; T should be approaching Preserve/Containment decision
      design_goal: force E to choose between protecting T and controlling evidence room
    - round: 4
      event: responder challenge from extraction side if Detection >=4
      design_goal: show authorization and identity state can prevent unnecessary firefight
    - round: 5
      event: Interdictor pressures Z-IDP; possible hard interrupt
      design_goal: make suppression/Guard Tech compete directly with kill attempts
    - round: 6
      event: power fluctuation if Z-MAINT unresolved or damaged
      design_goal: require validation after environmental state change
    - round: 7
      event: if containment unverified, propagation pressure increases and Window -1 extra
      design_goal: punish unverified apparent success without binary failure
    - round: 8
      event: Window collapse transitions immediately to Extract with sealed/verified value only
      design_goal: reinforce partial success and preservation discipline

  canonical_decision_knots:
    - knot_id: DK-01-R-SHOOT-OR-CORRELATE
      setup: R has one AP left; Retriever route is not yet confirmed; timeline is one correlation away from EV-TRANSFER-SPIKE.
      options:
        - Overwatch corridor: increases physical protection but delays technical certainty.
        - Compare telemetry: produces stronger containment evidence but risks Retriever movement.
      lesson: information and firepower compete for the same tactical attention.
    - knot_id: DK-02-E-HOLD-OR-INTERCEPT
      setup: E is holding evidence room while Interdictor approaches T and Retriever threatens custody.
      options:
        - stay and preserve evidence Control;
        - move to Guard Tech;
        - intercept Retriever;
        - suppress Interdictor from current position if LOS exists.
      lesson: E's job is allocating controlled space, not maximizing kills.
    - knot_id: DK-03-T-PRESERVE-OR-CONTAIN
      setup: T has enough evidence to suspect the personnel API; Preserve costs full activation and one Window tick.
      options:
        - preserve first: protects evidence but propagation continues one more Threat phase;
        - isolate first: reduces propagation but can complicate volatile evidence state;
        - broad shutdown: fast but harms continuity and may exceed proportional response.
      lesson: incident response contains competing priorities and must separate preservation, containment, and restoration.
    - knot_id: DK-04-T-VERIFY-OR-EXTRACT
      setup: Window nearly exhausted; containment appears successful but is only COMMITTED.
      options:
        - spend 1 AP Verify and risk hot extract;
        - leave immediately with unverified containment and better team safety.
      lesson: operational judgment can legitimately override perfect process; scoring records both.

  grade_outputs:
    operational:
      take: weighted combination of containment_state, timeline_state, dossier_custody, incident_scope_confidence
      team: standard injury/death model plus privacy-protected staff state
      exposure: detection peak + unnecessary responder engagement + privacy_exposure
      speed: Window and Extract ticks remaining
      compliance: authorization choices + need-to-know boundary + destructive recovery justification
    mastery:
      recognition: primary concept recognition events
      application: T containment/preservation plus R/E role applications
      transfer: authorization/confidence/segmentation choices under changed conditions
      explanation: debrief reconstruction of why containment, preservation, and restoration differed

  debrief:
    review_bindings:
      - concept_id: incident.containment
        cue_id: db-breach
        trigger_if: containment_state != VERIFIED
        debrief_text_key: REVIEW-CONTAINMENT-VS-RESTORE
      - concept_id: forensics.evidence-preservation
        cue_id: db-hash
        trigger_if: evidence_integrity < 2 or dossier_custody != SEALED
        debrief_text_key: REVIEW-PRESERVE-BEFORE-DESTRUCTIVE-RECOVERY
      - concept_id: observability.access-log
        cue_id: db-transfer
        trigger_if: timeline_state != SEALED
        debrief_text_key: REVIEW-CORRELATION
      - concept_id: identity.mfa
        cue_id: db-mfa
        trigger_if: false_identity_confidence == true
        debrief_text_key: REVIEW-MFA-LIMITS
      - concept_id: vendor.third-party-risk
        cue_id: db-supply-chain
        trigger_if: unsupported_root_cause_claim == true
        debrief_text_key: REVIEW-VENDOR-RISK-NOT-PROOF

  story_state_writes:
    - key: jordan_pre_recruitment_evidence
      predicate: dossier_custody == SEALED
      value: preserved
    - key: jordan_pre_recruitment_evidence
      predicate: dossier_custody in [PRESERVED, physical_boundary_stable] but not SEALED
      value: partial
    - key: cohort_privacy_trust
      predicate: privacy_exposure == 0
      value: damaged_by_breach_but_response_respected_people
    - key: cohort_privacy_trust
      predicate: privacy_exposure >= 2
      value: further_damaged_by_response
    - key: future_patient_zero_reporting_modifier
      predicate: privacy_exposure == 0 and evidence_integrity >= 2
      value: plus_reporting_trust
    - key: future_patient_zero_reporting_modifier
      predicate: privacy_exposure >= 2 or evidence_integrity == 0
      value: minus_reporting_trust

  implementation_acceptance_tests:
    - Player can finish primary containment without firing a weapon, but doing so should require exceptional positioning/control.
    - Player can engage in a satisfying firefight without automatically completing any primary IT objective.
    - At least one optimal play path uses suppression rather than a kill attempt to buy T an anchored action.
    - R evidence must reduce T ambiguity in a mechanically visible way.
    - E Control must prevent at least one lab interruption or custody loss in ordinary play.
    - T verified containment must alter enemy or route behavior on the board.
    - Broad shutdown must be mechanically valid but create continuity/compliance tradeoffs.
    - An interrupted Preserve action must remain recoverable without restart.
    - Window expiration must transition to extraction with partial value rather than show an instant failure banner.
    - Debrief must be capable of pointing to the precise concept and lyric cue associated with every major technical mistake.
