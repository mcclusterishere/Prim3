status: CANON-DERIVED
system: mission-lab-instance
version: 1.0.0
mission:
  id: exposure
  level_id: LVL-07
  episode_id: S03E01
  song_slug: data-breach
  title: EXPOSURE
  canon_status: DRAFT-IMPLEMENTATION-AUTHORITY
  design_intent: >-
    First end-to-end PRIM3 vertical slice proving that a song's IT concepts can be
    learned through the same six-AP tactical economy as movement, cover, shooting,
    suppression, reconnaissance, physical control, and extraction.
  runtime_mode:
    watch_target_minutes: 3
    play_target_minutes: 18

  concept_set:
    primary:
      - incident.data-breach
      - incident.breach-indicator
      - observability.access-log
      - incident.abnormal-data-transfer
      - incident.containment
      - forensics.evidence-preservation
      - identity.mfa
      - vendor.third-party-risk
    secondary:
      - malware.ransomware
      - incident.supply-chain-attack
      - incident.unauthorized-access
      - asset.compromised-asset
      - crypto.hash
      - crypto.salt
      - security.patch-management
    transfer:
      - governance.authorization
      - evidence.confidence-level
      - network.segmentation

  lyric_bindings:
    - cue_id: db-breach
      concept_ids: [incident.data-breach]
      start_ms: null
      end_ms: null
      review_priority: primary
    - cue_id: db-ransomware
      concept_ids: [malware.ransomware, incident.breach-indicator]
      start_ms: null
      end_ms: null
      review_priority: primary
    - cue_id: db-mfa
      concept_ids: [identity.mfa]
      start_ms: null
      end_ms: null
      review_priority: primary
    - cue_id: db-supply-chain
      concept_ids: [incident.supply-chain-attack, vendor.third-party-risk]
      start_ms: null
      end_ms: null
      review_priority: primary
    - cue_id: db-transfer
      concept_ids: [incident.abnormal-data-transfer, observability.access-log]
      start_ms: null
      end_ms: null
      review_priority: primary
    - cue_id: db-hash
      concept_ids: [crypto.hash, crypto.salt]
      start_ms: null
      end_ms: null
      review_priority: secondary

  operational_objectives:
    - objective_id: OBJ-P1-CONTAIN
      type: primary
      description: Contain the affected personnel/training service without destroying the evidence needed to understand the incident.
      weight: 0.35
      completion_predicate: containment_state == VERIFIED and evidence_integrity >= 2
      partial_predicate: containment_state in [COMMITTED, VERIFIED] and evidence_integrity >= 1
      failure_predicate: containment_state == NONE and window_clock == 0
      writes_state: [breach_containment_quality]
    - objective_id: OBJ-P2-SCOPE
      type: primary
      description: Establish a defensible impact scope from correlated evidence rather than assumption.
      weight: 0.25
      completion_predicate: incident_scope_confidence >= 80 and timeline_state == SEALED
      partial_predicate: incident_scope_confidence >= 50
      failure_predicate: incident_scope_confidence < 25 at extraction
      writes_state: [breach_scope_confidence]
    - objective_id: OBJ-S1-EVIDENCE
      type: secondary
      description: Preserve high-value logs and Jordan's pre-recruitment dossier without response-driven privacy leakage.
      weight: 0.15
      completion_predicate: evidence_integrity == 3 and dossier_custody == SEALED
      partial_predicate: evidence_integrity >= 1
      failure_predicate: dossier_destroyed == true
      writes_state: [jordan_pre_recruitment_evidence]
    - objective_id: OBJ-S2-CONTINUITY
      type: secondary
      description: Keep the minimum trusted training/notification functions available during containment.
      weight: 0.10
      completion_predicate: trusted_service_health >= 60
      partial_predicate: trusted_service_health >= 30
      failure_predicate: trusted_service_health == 0
      writes_state: [service_continuity_quality]
    - objective_id: OBJ-G1-PRIVACY
      type: ghost
      description: Prevent incident response itself from spreading sensitive personnel information beyond need-to-know staff.
      weight: 0.05
      completion_predicate: privacy_exposure == 0
      partial_predicate: privacy_exposure <= 1
      failure_predicate: privacy_exposure >= 3
      writes_state: [cohort_privacy_trust]
    - objective_id: OBJ-C1-AUTH
      type: compliance
      description: Keep collection, containment, and dossier access within incident-response authorization.
      weight: 0.10
      completion_predicate: unauthorized_actions == 0
      partial_predicate: unauthorized_actions == 1 and emergency_justified == true
      failure_predicate: unauthorized_actions >= 2
      writes_state: [authority_compliance]

  learning_objectives:
    - learning_id: LO-DB-01
      concept_id: incident.breach-indicator
      depth: recognize
      role: R
      evidence_predicate: R correctly marks at least three relevant signals and rejects at least one noisy but non-corroborating signal
      mastery_weight: 8
    - learning_id: LO-DB-02
      concept_id: observability.access-log
      depth: interpret
      role: R
      evidence_predicate: R correlates access events with a second independent signal before issuing scope warning
      mastery_weight: 8
    - learning_id: LO-DB-03
      concept_id: incident.abnormal-data-transfer
      depth: apply
      role: R
      evidence_predicate: abnormal transfer evidence changes containment scope or priority
      mastery_weight: 10
    - learning_id: LO-DB-04
      concept_id: incident.containment
      depth: apply
      role: T
      evidence_predicate: T isolates affected service path before broad restoration and verifies isolation
      mastery_weight: 14
    - learning_id: LO-DB-05
      concept_id: forensics.evidence-preservation
      depth: apply
      role: T
      evidence_predicate: T preserves evidence before any destructive recovery path
      mastery_weight: 14
    - learning_id: LO-DB-06
      concept_id: identity.mfa
      depth: interpret
      role: T
      evidence_predicate: player understands MFA changes authentication confidence but does not prove endpoint integrity
      mastery_weight: 8
    - learning_id: LO-DB-07
      concept_id: vendor.third-party-risk
      depth: apply
      role: R
      evidence_predicate: vendor dependency is traced and treated as a risk boundary rather than assumed root cause
      mastery_weight: 8
    - learning_id: LO-DB-08
      concept_id: governance.authorization
      depth: transfer
      role: E
      evidence_predicate: E protects privacy/access boundaries while preserving the incident workflow
      mastery_weight: 8
    - learning_id: LO-DB-09
      concept_id: evidence.confidence-level
      depth: transfer
      role: shared
      evidence_predicate: squad acts appropriately under partial evidence and increases confidence through corroboration
      mastery_weight: 10
    - learning_id: LO-DB-10
      concept_id: incident.data-breach
      depth: transfer
      role: shared
      evidence_predicate: player distinguishes containment, impact scoping, evidence preservation, and restoration as separate jobs
      mastery_weight: 12

  map:
    dimensions:
      width_tiles: 18
      height_tiles: 14
    zones:
      - zone_id: Z-OPS
        name: Incident Operations Floor
        initial_control: CONTESTED
        cover_profile: mixed
        destructible_objects: [glass_partitions, wall_displays]
        hazards: [privacy_exposure_if_civilians_enter]
        connected_zones: [Z-CORRIDOR, Z-IDP, Z-EVIDENCE]
      - zone_id: Z-IDP
        name: Identity / Personnel Service Room
        initial_control: NEUTRAL
        cover_profile: low
        destructible_objects: [service_console, rack_enclosure, door_controller]
        hazards: [fragile_service_state]
        connected_zones: [Z-OPS, Z-MAINT]
      - zone_id: Z-EVIDENCE
        name: Secure Evidence Room
        initial_control: NEUTRAL
        cover_profile: high
        destructible_objects: [evidence_locker, evidence_terminal]
        hazards: [chain_of_custody_break]
        connected_zones: [Z-OPS, Z-CORRIDOR]
      - zone_id: Z-CORRIDOR
        name: Central Glass Corridor
        initial_control: CONTESTED
        cover_profile: mixed
        destructible_objects: [glass, access_panel]
        hazards: [long_sightline]
        connected_zones: [Z-OPS, Z-EVIDENCE, Z-LOADING, Z-EXIT]
      - zone_id: Z-LOADING
        name: Vendor / Loading Access
        initial_control: LOST
        cover_profile: high
        destructible_objects: [loading_console, crates]
        hazards: [enemy_entry]
        connected_zones: [Z-CORRIDOR, Z-MAINT]
      - zone_id: Z-MAINT
        name: Maintenance / Power Passage
        initial_control: NEUTRAL
        cover_profile: high
        destructible_objects: [ups_panel, cable_tray]
        hazards: [power_transition]
        connected_zones: [Z-IDP, Z-LOADING]
      - zone_id: Z-EXIT
        name: Controlled Extraction Lobby
        initial_control: SECURE
        cover_profile: mixed
        destructible_objects: [outer_door_control]
        hazards: []
        connected_zones: [Z-CORRIDOR]

  clocks:
    approach: 4
    window: 8
    extract_clean: 5
    extract_hot: 3

  global_state:
    detection:
      min: 0
      max: 10
      start: 2
    heat:
      start: 1
    picture:
      start: UNCERTAIN
    service_health:
      start: 72
    evidence_integrity:
      start: 2
    civilian_safety:
      start: 100
    authorization:
      state: mixed
      constraints:
        - Incident team may access affected personnel-system records only for impact determination, containment, evidence preservation, and required notification.
        - Unrelated personal records are out of scope.
        - Destructive recovery is authorized only after preservation or explicit emergency justification.
        - Physical force is defensive and must remain consistent with the fictional mission threat state.

  squad:
    - unit_id: R-QUILL
      role: R
      start_zone: Z-OPS
      hp: 5
      ap_per_phase: 2
      movement: 6
      aim: 70
      will: 8
      role_stat: {name: Picture, value: 7}
      loadout_tags: [mobile_perimeter, compact_optics, incident_sensor_feed]
    - unit_id: E-VOSS
      role: E
      start_zone: Z-CORRIDOR
      hp: 7
      ap_per_phase: 2
      movement: 5
      aim: 65
      will: 7
      role_stat: {name: Hold, value: 7}
      loadout_tags: [hold_protect, evidence_control, compact_primary]
    - unit_id: T-RANE
      role: T
      start_zone: Z-OPS
      hp: 5
      ap_per_phase: 2
      movement: 4
      aim: 55
      will: 6
      role_stat: {name: Tech, value: 7}
      loadout_tags: [forensic_imaging, incident_console, offline_storage]

  role_resources:
    evidence_tokens:
      - token_id: EV-TIME-WINDOW
        producer_role: R
        fact_established: Two independent data sources identify the same incident time window.
        expiry: mission
        mechanical_effect: Timeline Scope step loses one decoy event and T Narrow Containment costs no extra Window tick.
      - token_id: EV-TRANSFER-SPIKE
        producer_role: R
        fact_established: A transfer anomaly is independently corroborated as relevant to the incident.
        expiry: mission
        mechanical_effect: T can classify the personnel API as high-priority without broad service shutdown.
      - token_id: EV-VENDOR-DEPENDENCY
        producer_role: R
        fact_established: The vendor integration is a real dependency touched during the incident window, but root cause is not proven.
        expiry: mission
        mechanical_effect: Reveals vendor connector edge and prevents unsupported root-cause certainty bonus.
      - token_id: EV-PHYSICAL-CUSTODY
        producer_role: E
        fact_established: Evidence room access and custody are physically controlled.
        expiry: round
        mechanical_effect: First privacy/custody interrupt against evidence is ignored this Threat phase.
    control_zones:
      - zone_id: Z-EVIDENCE
        owner_role: E
        state: NEUTRAL
        protected_objects: [evidence_locker, evidence_terminal]
      - zone_id: Z-IDP
        owner_role: E
        state: NEUTRAL
        protected_objects: [service_console, rack_enclosure]
    technical_outputs:
      - output_id: TECH-CONTAINMENT
        producer_role: T
        state_variable: containment_state
        delta: NONE -> PLAN_SELECTED -> COMMITTED -> VERIFIED
      - output_id: TECH-EVIDENCE
        producer_role: T
        state_variable: evidence_integrity
        delta: preserve/verify/seal can raise effective scoring confidence; destructive actions can lower it
      - output_id: TECH-SERVICE
        producer_role: T
        state_variable: trusted_service_health
        delta: containment may temporarily reduce availability; verified recovery restores trusted capacity

  lab_nodes:
    - id: LAB-R-TIMELINE
      world_object: Incident Telemetry Wall
      zone: Z-OPS
      owner_role: R
      concept_ids:
        - incident.breach-indicator
        - observability.access-log
        - incident.abnormal-data-transfer
        - evidence.confidence-level
        - vendor.third-party-risk
      prerequisites: []
      initial_state: OBSERVED
      terminal_states: [SEALED, INCONCLUSIVE]
      task_graph:
        - step_id: R-TL-01-OBSERVE
          atom: OBSERVE
          role: R
          ap_cost: 0
          window_cost: 0
          requires_control: none
          requires_picture: none
          requires_tokens: []
          consumes_tokens: []
          produces_tokens: []
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: OBSERVED
          success_deltas:
            - reveal event cards: badge access, service auth, transfer telemetry, endpoint report, vendor heartbeat, routine backup
          misapplication_to: OBSERVED
          misapplication_deltas: []
          interrupt_to: OBSERVED
          interrupt_deltas: []
          recovery_step_ids: [R-TL-02-COMPARE]
        - step_id: R-TL-02-COMPARE
          atom: COMPARE
          role: R
          ap_cost: 1
          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: none
          requires_tokens: []
          consumes_tokens: []
          produces_tokens: [EV-TIME-WINDOW]
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: CHARACTERIZED
          success_deltas:
            - incident_scope_confidence +15
            - picture_state UNCERTAIN -> PARTIAL
          misapplication_to: INCONCLUSIVE
          misapplication_deltas:
            - incident_scope_confidence -5
            - false_correlation_count +1
          interrupt_to: OBSERVED
          interrupt_deltas: []
          recovery_step_ids: [R-TL-02-COMPARE]
        - step_id: R-TL-03-TRANSFER
          atom: TRACE
          role: R
          ap_cost: 1
          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: PARTIAL_OR_BETTER
          requires_tokens: [EV-TIME-WINDOW]
          consumes_tokens: []
          produces_tokens: [EV-TRANSFER-SPIKE]
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: CHARACTERIZED
          success_deltas:
            - incident_scope_confidence +15
          misapplication_to: CHARACTERIZED
          misapplication_deltas:
            - incident_scope_confidence -5
          interrupt_to: CHARACTERIZED
          interrupt_deltas: []
          recovery_step_ids: [R-TL-03-TRANSFER]
        - step_id: R-TL-04-VENDOR
          atom: TRACE
          role: R
          ap_cost: 1
          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: PARTIAL_OR_BETTER
          requires_tokens: [EV-TIME-WINDOW]
          consumes_tokens: []
          produces_tokens: [EV-VENDOR-DEPENDENCY]
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: CHARACTERIZED
          success_deltas:
            - vendor_dependency_known true
            - incident_scope_confidence +10
          misapplication_to: CHARACTERIZED
          misapplication_deltas:
            - unsupported_root_cause_claim true
            - mastery vendor.third-party-risk -8
          interrupt_to: CHARACTERIZED
          interrupt_deltas: []
          recovery_step_ids: [R-TL-04-VENDOR]
        - step_id: R-TL-05-PRIORITIZE
          atom: PRIORITIZE
          role: R
          ap_cost: 1
          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: PARTIAL_OR_BETTER
          requires_tokens: [EV-TIME-WINDOW, EV-TRANSFER-SPIKE]
          consumes_tokens: []
          produces_tokens: []
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: VALIDATION_PENDING
          success_deltas:
            - priority_targets = [personnel_api, identity_session_boundary, evidence_store]
            - incident_scope_confidence +10
          misapplication_to: INCONCLUSIVE
          misapplication_deltas:
            - window_clock -1
            - low_value_response_work +1
          interrupt_to: CHARACTERIZED
          interrupt_deltas: []
          recovery_step_ids: [R-TL-05-PRIORITIZE]
        - step_id: R-TL-06-VERIFY
          atom: VERIFY
          role: R
          ap_cost: 1
          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: PARTIAL_OR_BETTER
          requires_tokens: [EV-TIME-WINDOW]
          consumes_tokens: []
          produces_tokens: []
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: SEALED
          success_deltas:
            - timeline_state SEALED
            - incident_scope_confidence +20
            - picture_state PARTIAL -> CLEAR
          misapplication_to: INCONCLUSIVE
          misapplication_deltas:
            - incident_scope_confidence unchanged
          interrupt_to: VALIDATION_PENDING
          interrupt_deltas: []
          recovery_step_ids: [R-TL-06-VERIFY]
      mastery_events:
        - event: concept.corroborated
          concept_id: observability.access-log
          predicate: R-TL-02-COMPARE success
          score_delta: 8
        - event: concept.applied
          concept_id: incident.abnormal-data-transfer
          predicate: EV-TRANSFER-SPIKE produced and used by T containment scope
          score_delta: 10
        - event: concept.applied_under_uncertainty
          concept_id: vendor.third-party-risk
          predicate: EV-VENDOR-DEPENDENCY produced without claiming proven root cause
          score_delta: 8

    - id: LAB-E-CUSTODY
      world_object: Evidence Room / Personnel Access Boundary
      zone: Z-EVIDENCE
      owner_role: E
      concept_ids:
        - forensics.evidence-preservation
        - governance.authorization
        - incident.data-breach
      prerequisites: []
      initial_state: OBSERVED
      terminal_states: [STABILIZED, DEGRADED]
      task_graph:
        - step_id: E-CU-01-ROUTE
          atom: ROUTE
          role: E
          ap_cost: 1
          window_cost: 0
          requires_control: none
          requires_picture: none
          requires_tokens: []
          consumes_tokens: []
          produces_tokens: []
