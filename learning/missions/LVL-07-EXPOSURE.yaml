          window_cost: 0
          requires_control: NOT_LOST
          requires_picture: none
          requires_tokens: []
          consumes_tokens: []
          produces_tokens: [EV-PHYSICAL-CUSTODY]
          anchors_operator: false
          fragile: false
          allowed_when_wounded: true
          success_to: WORK_IN_PROGRESS
