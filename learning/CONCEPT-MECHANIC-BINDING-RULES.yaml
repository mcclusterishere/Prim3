status: CANON
system: concept-mechanic-binding-resolver
version: 1.0.0
owner: Matthew McCluster
purpose: >-
  Ensure every concept in learning/SONG-CONCEPT-INDEX.md resolves to a default
  battlefield role, task-atom family, lab pattern, observable evidence, tactical
  output, error consequence, and verification method even before an episode-specific
  override is authored.

resolution_order:
  - exact_concept_override
  - namespace_binding
  - mission_specific_override
notes:
  - Mission-specific files may increase specificity but may not detach a primary concept from observable player behavior.
  - Exact offensive-security concepts must remain defensive, recognition-based, architectural, or sandboxed.
  - If a concept namespace is absent from this registry, the build should flag it as UNBOUND rather than silently inventing a generic hack mechanic.

namespace_bindings:
  professional:
    default_role: shared
    secondary_roles: [R, E, T]
    patterns: [Authorization / Scope Overlay, Incident Timeline Correlation]
    atoms: [OBSERVE, CLASSIFY, PRIORITIZE, DOCUMENT, AUTHORIZE]
    world_objects: [briefing_board, finding_report, evidence_record, debrief_console]
    observable_evidence: [scope_text, role_history, interview_claims, findings, remediation_state]
    battlefield_output: [authorization_clarity, standing, debrief_quality, objective_priority]
    wrong_consequence: [wasted_AP, compliance_loss, bad_priority]
    verification: [document_crosscheck, sponsor_or_owner_confirmation]
